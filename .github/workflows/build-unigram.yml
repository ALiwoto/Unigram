name: Build Unigram

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-unigram-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  PLATFORM: x64
  VCPKG_COMMIT: db0aad6b4f71f360dc3b2261b29de51dce4fa59b
  WEBRTC_BRANCH: branch-heads/6312
  WEBRTC_REF: m123
  VLC_VERSION: 3.0.22-rc1
  VLC_SOURCE_REF: 3.0.22-rc1

jobs:
  build-vlc:
    name: Build LibVLC
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout LibVLC source
        shell: bash
        run: |
          rm -rf Libraries/vlc/vlc
          git clone --branch "$VLC_SOURCE_REF" --depth 1 https://github.com/videolan/vlc.git Libraries/vlc/vlc

      - name: Restore LibVLC cache
        id: vlc-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/vlc-x64.tar.gz
          key: vlc-${{ runner.os }}-${{ env.VLC_SOURCE_REF }}-${{ hashFiles('Libraries/vlc/*.patch', 'Libraries/vlc/*.ps1', 'Libraries/vlc/*.nuspec', 'Libraries/vlc/*.props', 'Libraries/vlc/*.targets', 'Libraries/vlc/revision.txt', '.github/scripts/build-vlc.sh') }}

      - name: Build LibVLC
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash .github/scripts/build-vlc.sh .ci-cache/vlc-x64.tar.gz

      - name: Save LibVLC cache
        if: steps.vlc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/vlc-x64.tar.gz
          key: ${{ steps.vlc-cache.outputs.cache-primary-key }}

      - name: Upload LibVLC artifact
        uses: actions/upload-artifact@v4
        with:
          name: vlc-x64
          path: .ci-cache/vlc-x64.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build x64 package
    runs-on: windows-2025-vs2026
    needs: build-vlc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout required submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive `
            Libraries/CoreWindowCustomDPI `
            Libraries/flatbuffers `
            Libraries/libprisma `
            Libraries/libutf `
            Libraries/libwebp `
            Libraries/tdlib `
            Libraries/tgcalls

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Report Visual Studio installation
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to find vswhere.exe.'
          }

          & $vswhere -latest -products * -format json

          $vcToolsRoot = 'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\MSVC'
          if (Test-Path $vcToolsRoot) {
            Get-ChildItem $vcToolsRoot -Directory | Select-Object -ExpandProperty FullName
          }

      - name: Download LibVLC artifact
        uses: actions/download-artifact@v4
        with:
          name: vlc-x64
          path: .ci-cache

      - name: Restore LibVLC build tree
        shell: pwsh
        run: |
          tar -xf .ci-cache\vlc-x64.tar.gz -C .

      - name: Pack LibVLC NuGet
        shell: pwsh
        run: |
          $nuspec = Join-Path $PWD 'artifacts\vlc\VideoLAN.LibVLC.UWP.x64.nuspec'
          New-Item -ItemType Directory -Path (Split-Path $nuspec -Parent) -Force | Out-Null
          .\.github\scripts\new-vlc-x64-nuspec.ps1 -InputPath 'Libraries\vlc\VideoLAN.LibVLC.UWP.nuspec' -OutputPath $nuspec
          nuget pack $nuspec -BasePath Libraries\vlc -OutputDirectory Libraries -NoPackageAnalysis

      - name: Detect Windows SDK
        id: windows-sdk
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Windows Kits\10\Include'
          $sdk = Get-ChildItem $root -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'um\Windows.h') } |
            Sort-Object Name -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if (-not $sdk) {
            throw 'No Windows SDK installation was found on the runner.'
          }

          "version=$sdk" >> $env:GITHUB_OUTPUT
          "WINDOWS_SDK_VERSION=$sdk" >> $env:GITHUB_ENV

      - name: Generate Constants.Secret.cs
        shell: pwsh
        env:
          UNIGRAM_API_ID: ${{ secrets.UNIGRAM_API_ID }}
          UNIGRAM_API_HASH: ${{ secrets.UNIGRAM_API_HASH }}
          UNIGRAM_APP_CHANNEL: ${{ secrets.UNIGRAM_APP_CHANNEL }}
        run: |
          .\.github\scripts\write-constants-secret.ps1

      - name: Compute dependency revisions
        id: revisions
        shell: pwsh
        run: |
          "tdlib=$(git -C Libraries/tdlib rev-parse HEAD)" >> $env:GITHUB_OUTPUT
          "tgcalls=$(git -C Libraries/tgcalls rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci\vcpkg\bincache
            .ci\vcpkg\downloads
            .ci\vcpkg\installed
            .ci\vcpkg\packages
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ env.PLATFORM }}-${{ hashFiles('Libraries/vcpkg.patch', '.github/scripts/patch-vcpkg-ffmpeg.ps1', '.github/scripts/vcpkg-packages.txt') }}

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $PWD '.ci\vcpkg'
          $stash = Join-Path $PWD '.ci\vcpkg-restored-cache'
          $cacheDirs = @('bincache', 'downloads', 'installed', 'packages')

          if ((Test-Path $root) -and -not (Test-Path (Join-Path $root '.git'))) {
            Remove-Item $stash -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $stash -Force | Out-Null

            foreach ($dir in $cacheDirs) {
              $path = Join-Path $root $dir
              if (Test-Path $path) {
                Move-Item -Path $path -Destination $stash -Force
              }
            }

            Remove-Item $root -Recurse -Force
          }

          if (-not (Test-Path (Join-Path $root '.git'))) {
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
            if ($LASTEXITCODE -ne 0) { throw 'git clone vcpkg failed.' }
          }

          if (Test-Path $stash) {
            foreach ($dir in $cacheDirs) {
              $path = Join-Path $stash $dir
              if (Test-Path $path) {
                Move-Item -Path $path -Destination $root -Force
              }
            }
          }

          git -C $root fetch --depth 1 origin $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "git fetch vcpkg commit '$env:VCPKG_COMMIT' failed." }
          git -C $root checkout $env:VCPKG_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "git checkout vcpkg commit '$env:VCPKG_COMMIT' failed." }

          $patchPath = (Resolve-Path 'Libraries\vcpkg.patch').Path
          git -C $root apply --check $patchPath 2>$null
          if ($LASTEXITCODE -eq 0) {
            git -C $root apply $patchPath
            if ($LASTEXITCODE -ne 0) { throw "Unable to apply vcpkg patch '$patchPath'." }
          }

          .\.github\scripts\patch-vcpkg-ffmpeg.ps1 -VcpkgRoot $root

          if (-not (Test-Path (Join-Path $root 'vcpkg.exe'))) {
            & (Join-Path $root 'bootstrap-vcpkg.bat')
            if ($LASTEXITCODE -ne 0) { throw 'bootstrap-vcpkg.bat failed.' }
          }

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $root = (Resolve-Path '.ci\vcpkg').Path
          $binCache = Join-Path $root 'bincache'
          New-Item -ItemType Directory -Path $binCache -Force | Out-Null

          $env:VCPKG_ROOT = $root
          $env:VCPKG_BINARY_SOURCES = "clear;files,$binCache,readwrite"

          $packages = Get-Content '.github\scripts\vcpkg-packages.txt' |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }
          if (-not $packages) {
            throw 'No vcpkg packages were listed in .github\scripts\vcpkg-packages.txt.'
          }

          & (Join-Path $root 'vcpkg.exe') install @packages
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed.' }

          & (Join-Path $root 'vcpkg.exe') integrate install

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .ci\vcpkg\bincache
            .ci\vcpkg\downloads
            .ci\vcpkg\installed
            .ci\vcpkg\packages
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Restore TDLib cache
        id: tdjson-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            Libraries\tdjson\td_api.tl
            Libraries\tdjson\x64
          key: tdjson-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ steps.revisions.outputs.tdlib }}-${{ hashFiles('Libraries/tdjson/build.ps1') }}

      - name: Probe TDLib outputs
        id: tdjson-probe
        shell: pwsh
        run: |
          $expected = @(
            'Libraries\tdjson\td_api.tl',
            'Libraries\tdjson\x64\tdjson.dll',
            'Libraries\tdjson\x64\libcrypto-3-x64.dll',
            'Libraries\tdjson\x64\libssl-3-x64.dll'
          )
          Write-Host 'TDLib restored files:'
          foreach ($path in @('Libraries\tdjson\td_api.tl', 'Libraries\tdjson\x64')) {
            if (Test-Path $path) {
              Get-ChildItem $path -Force -Recurse |
                Select-Object FullName, Length |
                Format-Table -AutoSize
            } else {
              Write-Host "  Missing path: $path"
            }
          }

          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) {
            Write-Host 'TDLib cache is missing expected outputs:'
            $missing | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host 'TDLib cache contains expected outputs.'
          }
          $ready = ($missing.Count -eq 0)
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Copy TDLib zlib runtime
        shell: pwsh
        run: |
          $target = 'Libraries\tdjson\x64\zlib1.dll'
          if (Test-Path $target) {
            return
          }

          $source = '.ci\vcpkg\installed\x64-uwp\bin\zlib1.dll'
          if (-not (Test-Path $source)) {
            $source = Get-ChildItem '.ci\vcpkg\installed' -Recurse -Filter zlib1.dll |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $source) {
            throw 'Unable to find vcpkg-provided zlib1.dll.'
          }

          New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
          Copy-Item -Path $source -Destination $target -Force

      - name: Build TDLib
        if: steps.tdjson-cache.outputs.cache-hit != 'true' || steps.tdjson-probe.outputs.ready != 'true'
        shell: pwsh
        run: |
          $vcpkgRoot = (Resolve-Path '.ci\vcpkg').Path
          $gperf = Join-Path $vcpkgRoot 'installed\x86-windows\tools\gperf\gperf.exe'
          if (-not (Test-Path $gperf)) {
            $gperf = Get-ChildItem (Join-Path $vcpkgRoot 'installed') -Recurse -Filter gperf.exe |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $gperf) {
            throw 'Unable to find vcpkg-provided gperf.exe.'
          }
          $env:PATH = "$(Split-Path $gperf -Parent);$env:PATH"

          Push-Location Libraries\tdjson
          try {
            .\build.ps1 -vcpkg_root $vcpkgRoot -arch x64
          } finally {
            Pop-Location
          }

      - name: Save TDLib cache
        if: steps.tdjson-probe.outputs.ready != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            Libraries\tdjson\td_api.tl
            Libraries\tdjson\x64
          key: ${{ steps.tdjson-cache.outputs.cache-primary-key }}

      - name: Prepare WebRTC storage
        shell: pwsh
        run: |
          git config --global core.longpaths true

          $webrtcTarget = 'D:\webrtc-cache'
          $depotToolsTarget = 'D:\depot_tools-cache'

          New-Item -ItemType Directory -Path $webrtcTarget -Force | Out-Null
          New-Item -ItemType Directory -Path $depotToolsTarget -Force | Out-Null

          if (-not (Test-Path 'C:\webrtc')) {
            New-Item -ItemType Junction -Path 'C:\webrtc' -Target $webrtcTarget | Out-Null
          }

          if (-not (Test-Path 'C:\depot_tools')) {
            New-Item -ItemType Junction -Path 'C:\depot_tools' -Target $depotToolsTarget | Out-Null
          }

      - name: Prepare Visual Studio path for WebRTC
        shell: pwsh
        run: |
          $communityPath = 'C:\Program Files\Microsoft Visual Studio\2022\Community'
          if (Test-Path $communityPath) {
            return
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'Unable to find vswhere.exe.'
          }

          $installationPath = & $vswhere -latest -products * -property installationPath
          if (-not $installationPath) {
            throw 'Unable to locate a Visual Studio installation.'
          }

          New-Item -ItemType Junction -Path $communityPath -Target $installationPath | Out-Null

      - name: Prepare Windows SDK path for WebRTC
        shell: pwsh
        run: |
          $requestedSdk = '10.0.22621.0'
          $installedSdk = $env:WINDOWS_SDK_VERSION
          $sdkRoot = 'C:\Program Files (x86)\Windows Kits\10'

          foreach ($subdir in @('Include', 'Lib')) {
            $requestedPath = Join-Path $sdkRoot "$subdir\$requestedSdk"
            $installedPath = Join-Path $sdkRoot "$subdir\$installedSdk"

            if (-not (Test-Path $installedPath)) {
              throw "Installed Windows SDK path '$installedPath' was not found."
            }

            if (-not (Test-Path $requestedPath)) {
              New-Item -ItemType Junction -Path $requestedPath -Target $installedPath | Out-Null
            }
          }

      - name: Restore WebRTC cache
        id: webrtc-cache
        uses: actions/cache/restore@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 60
        with:
          path: |
            D:\depot_tools-cache
            D:\webrtc-cache
          key: webrtc-${{ runner.os }}-${{ env.WEBRTC_BRANCH }}-${{ env.WEBRTC_REF }}-${{ steps.revisions.outputs.tgcalls }}-${{ hashFiles('Libraries/webrtc/**') }}

      - name: Probe WebRTC outputs
        id: webrtc-probe
        shell: pwsh
        run: |
          $sourceReady = Test-Path 'C:\webrtc\src\DEPS'
          $buildReady = Test-Path 'C:\webrtc\src\out\msvc\uwp\release\x64\obj\webrtc.lib'
          "source_ready=$($sourceReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "build_ready=$($buildReady.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Acquire WebRTC source
        if: steps.webrtc-cache.outputs.cache-hit != 'true' || steps.webrtc-probe.outputs.source_ready != 'true'
        shell: cmd
        run: |
          cd /d C:\
          call "%GITHUB_WORKSPACE%\Libraries\webrtc\acquire.cmd"

      - name: Build WebRTC
        if: steps.webrtc-cache.outputs.cache-hit != 'true' || steps.webrtc-probe.outputs.build_ready != 'true'
        shell: cmd
        run: |
          set "PATH=C:\depot_tools;C:\webrtc\src\buildtools\win;C:\webrtc\src\third_party\ninja;%PATH%"
          set "INCLUDE="
          set "LIB="
          set "LIBPATH="
          set "WindowsSDKDir="
          set "WindowsSDKVersion="
          set "UCRTVersion="
          where gn
          where ninja
          cd /d C:\webrtc\src
          call "%GITHUB_WORKSPACE%\Libraries\webrtc\build.cmd" x64 release

      - name: Save WebRTC cache
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            D:\depot_tools-cache
            D:\webrtc-cache
          key: ${{ steps.webrtc-cache.outputs.cache-primary-key }}

      - name: Restore NuGet caches
        id: nuget-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packages
            ~\.nuget\packages
            ~\AppData\Local\NuGet\v3-cache
          key: nuget-${{ runner.os }}-${{ hashFiles('nuget.config', 'Telegram/Telegram.csproj', 'Telegram.Msix/Telegram.Msix.wapproj', 'Telegram.Native/Telegram.Native.vcxproj', 'Telegram.Native.Calls/Telegram.Native.Calls.vcxproj', 'Telegram.Native/packages.config', 'Telegram.Native.Calls/packages.config', 'Telegram.Generators/Telegram.Generators.csproj', 'Telegram.Stub/Telegram.Stub.csproj') }}

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore Telegram.Native\packages.config -PackagesDirectory packages -ConfigFile nuget.config -NonInteractive
          nuget restore Telegram.Native.Calls\packages.config -PackagesDirectory packages -ConfigFile nuget.config -NonInteractive

          msbuild Telegram.Msix\Telegram.Msix.wapproj `
            /t:Restore `
            /m `
            /p:Configuration=${env:CONFIGURATION} `
            /p:Platform=${env:PLATFORM} `
            /p:RestorePackagesConfig=true `
            /p:TargetPlatformVersion=${env:WINDOWS_SDK_VERSION} `
            /p:WindowsTargetPlatformVersion=${env:WINDOWS_SDK_VERSION}

      - name: Save NuGet caches
        if: steps.nuget-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packages
            ~\.nuget\packages
            ~\AppData\Local\NuGet\v3-cache
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Build package
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $PWD 'artifacts'
          $appxDir = Join-Path $artifactRoot 'appx'
          $logDir = Join-Path $artifactRoot 'logs'

          New-Item -ItemType Directory -Path $appxDir -Force | Out-Null
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null

          msbuild Telegram.Msix\Telegram.Msix.wapproj `
            /m `
            /bl:$logDir\build.binlog `
            /p:Configuration=${env:CONFIGURATION} `
            /p:Platform=${env:PLATFORM} `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundlePlatforms=${env:PLATFORM} `
            /p:AppxBundle=Always `
            /p:RestorePackagesConfig=true `
            /p:TargetPlatformVersion=${env:WINDOWS_SDK_VERSION} `
            /p:WindowsTargetPlatformVersion=${env:WINDOWS_SDK_VERSION} `
            /p:AppxPackageDir="$appxDir\"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unigram-x64
          path: artifacts
          if-no-files-found: error
          retention-days: 14
